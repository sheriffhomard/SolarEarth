<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sunGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <radialGradient id="earthGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background space -->
  <rect width="512" height="512" rx="104" fill="#030712" />

  <!-- Solar Corona / Glow -->
  <circle cx="160" cy="160" r="140" fill="url(#glowGrad)" />

  <!-- Solar Rays / Radiation Vectors -->
  <g stroke="url(#rayGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="160" y1="20" x2="160" y2="46" />
    <line x1="160" y1="274" x2="160" y2="300" />
    <line x1="20" y1="160" x2="46" y2="160" />
    <line x1="274" y1="160" x2="300" y2="160" />
    <line x1="61" y1="61" x2="80" y2="80" />
    <line x1="239" y1="239" x2="258" y2="258" />
    <line x1="61" y1="259" x2="80" y2="240" />
    <line x1="239" y1="81" x2="258" y2="62" />
  </g>

  <!-- Sun Body -->
  <circle cx="160" cy="160" r="88" fill="url(#sunGrad)" />

  <!-- Radiation Flux Arc / Atmospheric Interception -->
  <path d="M 210,130 Q 320,180 340,310" stroke="#fef08a" stroke-width="3" stroke-dasharray="6,4" fill="none" opacity="0.8" />
  <path d="M 230,170 Q 330,220 360,340" stroke="#fdba74" stroke-width="3" stroke-dasharray="6,4" fill="none" opacity="0.6" />
  <path d="M 190,220 Q 280,280 300,380" stroke="#fef08a" stroke-width="2" stroke-dasharray="5,3" fill="none" opacity="0.7" />

  <!-- Earth Atmosphere Glow -->
  <circle cx="340" cy="340" r="118" fill="#38bdf8" opacity="0.25" />

  <!-- Earth Globe -->
  <circle cx="340" cy="340" r="110" fill="url(#earthGrad)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Stylized Earth Continents / Cloud patterns -->
  <path d="M 270,320 Q 300,300 330,315 Q 360,305 380,325 Q 400,350 370,380 Q 330,395 295,370 Z" fill="#22c55e" opacity="0.55" />
  <path d="M 320,400 Q 350,390 380,410 Q 360,435 330,430 Z" fill="#22c55e" opacity="0.5" />
  <path d="M 370,270 Q 400,280 415,310 Q 425,300 405,280 Z" fill="#22c55e" opacity="0.5" />

  <!-- Grid Meridian Lines on Earth -->
  <ellipse cx="340" cy="340" rx="90" ry="110" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.3" />
  <ellipse cx="340" cy="340" rx="45" ry="110" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.3" />
  <line x1="230" y1="340" x2="450" y2="340" stroke="#60a5fa" stroke-width="1.2" opacity="0.4" />
</svg>
