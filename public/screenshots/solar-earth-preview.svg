<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <!-- Background space gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Chart fill gradient -->
    <linearGradient id="ghiArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="dniArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.0" />
    </linearGradient>

    <!-- Card glass gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#070c18" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent button gradient -->
    <linearGradient id="amberBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />

  <!-- Subtle starfield/dots -->
  <g fill="#94a3b8" opacity="0.15">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="280" cy="140" r="1" />
    <circle cx="450" cy="60" r="1.5" />
    <circle cx="780" cy="95" r="1" />
    <circle cx="1100" cy="70" r="1.5" />
    <circle cx="950" cy="180" r="1" />
    <circle cx="200" cy="400" r="1.5" />
    <circle cx="1180" cy="350" r="1" />
    <circle cx="100" cy="650" r="1.5" />
    <circle cx="1220" cy="720" r="1" />
  </g>

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <rect x="0" y="0" width="1280" height="68" fill="#030712" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />

  <!-- Logo & Title -->
  <g transform="translate(32, 14)">
    <rect width="40" height="40" rx="10" fill="#f59e0b" />
    <!-- Sun icon inside -->
    <circle cx="18" cy="20" r="8" fill="#fef08a" />
    <ellipse cx="20" cy="20" rx="16" ry="9" stroke="#ffffff" stroke-width="1.5" fill="none" transform="rotate(-25 20 20)" stroke-dasharray="2,2" />
    <circle cx="29" cy="15" r="3" fill="#0284c7" />

    <text x="52" y="22" fill="#f8fafc" font-size="18" font-weight="800" class="font-sans" letter-spacing="0.5">SOLAR EARTH</text>
    <rect x="180" y="8" width="46" height="20" rx="5" fill="#451a03" stroke="#92400e" stroke-width="1" />
    <text x="188" y="22" fill="#fbbf24" font-size="11" font-weight="700" class="font-mono">V0.3.0</text>
    <text x="52" y="36" fill="#94a3b8" font-size="11" class="font-sans">Observatoire Scientifique &amp; Modélisation Solaire 100% Autonome</text>
  </g>

  <!-- Top Right Badges & Controls -->
  <g transform="translate(860, 18)">
    <!-- PWA Local badge -->
    <rect width="180" height="32" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#047857" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#34d399" />
    <text x="28" y="21" fill="#6ee7b7" font-size="11" font-weight="600" class="font-mono">PWA : IndexedDB Local</text>

    <!-- Theme toggle mock -->
    <g transform="translate(192, 0)">
      <rect width="32" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="6" fill="#fbbf24" />
      <line x1="16" y1="5" x2="16" y2="7" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
      <line x1="16" y1="25" x2="16" y2="27" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
      <line x1="5" y1="16" x2="7" y2="16" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
      <line x1="25" y1="16" x2="27" y2="16" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- In-App Install Button -->
    <g transform="translate(236, 0)">
      <rect width="150" height="32" rx="8" fill="url(#amberBtn)" />
      <!-- Download arrow -->
      <path d="M 18,12 L 18,20 M 15,17 L 18,20 L 21,17 M 13,22 L 23,22" stroke="#020617" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="32" y="21" fill="#020617" font-size="12" font-weight="700" class="font-sans">Installer l'app</text>
    </g>
  </g>

  <!-- ================= LEFT SIDEBAR ================= -->
  <g transform="translate(32, 88)">
    <rect width="210" height="680" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />

    <!-- Navigation items -->
    <g transform="translate(14, 16)">
      <!-- Dashboard (Active) -->
      <rect width="182" height="38" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5" />
      <text x="40" y="24" fill="#fde68a" font-size="13" font-weight="700" class="font-sans">Dashboard</text>

      <!-- World Map -->
      <g transform="translate(0, 46)">
        <rect width="182" height="36" rx="8" fill="transparent" />
        <text x="40" y="23" fill="#94a3b8" font-size="13" font-weight="500" class="font-sans">World Map</text>
      </g>

      <!-- Simulateur PV -->
      <g transform="translate(0, 88)">
        <rect width="182" height="36" rx="8" fill="transparent" />
        <text x="40" y="23" fill="#94a3b8" font-size="13" font-weight="500" class="font-sans">Simulateur PV</text>
      </g>

      <!-- Trajectoire Solaire -->
      <g transform="translate(0, 130)">
        <rect width="182" height="36" rx="8" fill="transparent" />
        <text x="40" y="23" fill="#94a3b8" font-size="13" font-weight="500" class="font-sans">Trajectoire Solaire</text>
      </g>

      <!-- History -->
      <g transform="translate(0, 172)">
        <rect width="182" height="36" rx="8" fill="transparent" />
        <text x="40" y="23" fill="#94a3b8" font-size="13" font-weight="500" class="font-sans">Historique</text>
      </g>

      <!-- Laboratoire & Audit -->
      <g transform="translate(0, 214)">
        <rect width="182" height="36" rx="8" fill="transparent" />
        <text x="40" y="23" fill="#94a3b8" font-size="13" font-weight="500" class="font-sans">Laboratoire &amp; Audit</text>
      </g>

      <!-- Paramètres Système (New Highlight) -->
      <g transform="translate(0, 256)">
        <rect width="182" height="36" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1" />
        <text x="40" y="23" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Paramètres Système</text>
        <circle cx="168" cy="18" r="4" fill="#f59e0b" />
      </g>
    </g>

    <!-- Sidebar footer info -->
    <g transform="translate(16, 520)">
      <rect width="178" height="136" rx="12" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="26" fill="#38bdf8" font-size="11" font-weight="700" class="font-mono">DOUBLE-MODE ARCH</text>
      <text x="14" y="48" fill="#94a3b8" font-size="11" class="font-mono">PWA : Mobile IndexedDB</text>
      <text x="14" y="68" fill="#94a3b8" font-size="11" class="font-mono">DEV : SQLite 3 Fichier</text>
      <line x1="14" y1="82" x2="164" y2="82" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="102" fill="#34d399" font-size="11" font-weight="600" class="font-mono">✓ 100% Autonome</text>
      <text x="14" y="120" fill="#f59e0b" font-size="11" class="font-mono">Auto-Update : Actif</text>
    </g>
  </g>

  <!-- ================= MAIN CONTENT DASHBOARD ================= -->
  <g transform="translate(262, 88)">

    <!-- Top Station & PVGIS Banner -->
    <rect width="986" height="58" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <g transform="translate(20, 18)">
      <text x="0" y="16" fill="#f8fafc" font-size="16" font-weight="800" class="font-sans">Observatoire de Paris (France)</text>
      <text x="240" y="16" fill="#38bdf8" font-size="12" font-mono font-weight="600" class="font-mono">48.836° N, 2.336° E · Alt: 67 m</text>
      <text x="0" y="32" fill="#94a3b8" font-size="11" class="font-sans">Données officielles PVGIS v5.3 (SARAH-3 &amp; ERA5) · Convention UTC intégrée</text>
    </g>
    <!-- Live date badge -->
    <g transform="translate(780, 14)">
      <rect width="186" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="20" fill="#fde68a" font-size="12" font-weight="600" class="font-mono">Date : 2020-06-21 (Été)</text>
    </g>

    <!-- 4 KPI CARDS WITH INFOBULLES (GHI, DNI, DHI, ELEVATION) -->
    <g transform="translate(0, 72)">
      <!-- Card 1: Daily Irradiation -->
      <g transform="translate(0, 0)">
        <rect width="236" height="96" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="600" class="font-mono">IRRADIATION JOURNALIÈRE</text>
        <circle cx="210" cy="20" r="8" fill="#1e293b" />
        <text x="208" y="24" fill="#38bdf8" font-size="10" font-weight="700" class="font-sans">i</text>
        <text x="16" y="60" fill="#f8fafc" font-size="28" font-weight="800" class="font-mono">7.42</text>
        <text x="82" y="60" fill="#94a3b8" font-size="14" class="font-mono">kWh/m²</text>
        <text x="16" y="80" fill="#34d399" font-size="11" class="font-mono">Énergie totale : 7 420 Wh/m²</text>
      </g>

      <!-- Card 2: Peak GHI -->
      <g transform="translate(250, 0)">
        <rect width="236" height="96" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" fill="#f59e0b" font-size="11" font-weight="600" class="font-mono">PIC IRRADIANCE (GHI)</text>
        <circle cx="210" cy="20" r="8" fill="#1e293b" />
        <text x="208" y="24" fill="#f59e0b" font-size="10" font-weight="700" class="font-sans">i</text>
        <text x="16" y="60" fill="#fbbf24" font-size="28" font-weight="800" class="font-mono">892</text>
        <text x="74" y="60" fill="#94a3b8" font-size="14" class="font-mono">W/m²</text>
        <text x="16" y="80" fill="#94a3b8" font-size="11" class="font-mono">Midi solaire vrai (13:00 UTC)</text>
      </g>

      <!-- Card 3: Insolation OMM -->
      <g transform="translate(500, 0)">
        <rect width="236" height="96" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" fill="#ea580c" font-size="11" font-weight="600" class="font-mono">INSOLATION OMM (DNI)</text>
        <circle cx="210" cy="20" r="8" fill="#1e293b" />
        <text x="208" y="24" fill="#ea580c" font-size="10" font-weight="700" class="font-sans">i</text>
        <text x="16" y="60" fill="#fb923c" font-size="28" font-weight="800" class="font-mono">14.0</text>
        <text x="78" y="60" fill="#94a3b8" font-size="14" class="font-mono">h</text>
        <text x="16" y="80" fill="#94a3b8" font-size="11" class="font-mono">Seuil : DNI ≥ 120 W/m²</text>
      </g>

      <!-- Card 4: Solar Elevation Max -->
      <g transform="translate(750, 0)">
        <rect width="236" height="96" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" fill="#38bdf8" font-size="11" font-weight="600" class="font-mono">HAUTEUR SOLAIRE MAX</text>
        <circle cx="210" cy="20" r="8" fill="#1e293b" />
        <text x="208" y="24" fill="#38bdf8" font-size="10" font-weight="700" class="font-sans">i</text>
        <text x="16" y="60" fill="#38bdf8" font-size="28" font-weight="800" class="font-mono">64.6</text>
        <text x="80" y="60" fill="#94a3b8" font-size="14" class="font-mono">°</text>
        <text x="16" y="80" fill="#94a3b8" font-size="11" class="font-mono">Réfraction de Saemundsson</text>
      </g>
    </g>

    <!-- MAIN SOLAR RADIATION 24H CHART VIEWPORT -->
    <g transform="translate(0, 184)">
      <rect width="986" height="340" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />

      <!-- Chart Header with Interactive Toggles & Tooltips -->
      <g transform="translate(24, 18)">
        <text x="0" y="16" fill="#f8fafc" font-size="15" font-weight="700" class="font-sans">Cycle Solaire Horaire (24 Heures)</text>

        <!-- Legend badges with tooltips -->
        <g transform="translate(360, 2)">
          <!-- GHI Badge -->
          <rect width="110" height="24" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="1" />
          <line x1="12" y1="12" x2="24" y2="12" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
          <text x="32" y="16" fill="#fde68a" font-size="11" font-weight="700" class="font-mono">GHI (Global)</text>

          <!-- DNI Badge -->
          <g transform="translate(122, 0)">
            <rect width="110" height="24" rx="6" fill="#7c2d12" fill-opacity="0.4" stroke="#ea580c" stroke-width="1" />
            <line x1="12" y1="12" x2="24" y2="12" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
            <text x="32" y="16" fill="#fed7aa" font-size="11" font-weight="700" class="font-mono">DNI (Direct)</text>
          </g>

          <!-- DHI Badge -->
          <g transform="translate(244, 0)">
            <rect width="110" height="24" rx="6" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
            <line x1="12" y1="12" x2="24" y2="12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
            <text x="32" y="16" fill="#bae6fd" font-size="11" font-weight="700" class="font-mono">DHI (Diffus)</text>
          </g>
        </g>
      </g>

      <!-- Chart Grid & Waves (0..1000 W/m² and 00:00..23:00) -->
      <g transform="translate(60, 60)">
        <!-- Horizontal gridlines -->
        <line x1="0" y1="0" x2="880" y2="0" stroke="#1e293b" stroke-dasharray="3,3" />
        <text x="-35" y="4" fill="#64748b" font-size="10" font-mono>1000</text>

        <line x1="0" y1="60" x2="880" y2="60" stroke="#1e293b" stroke-dasharray="3,3" />
        <text x="-30" y="64" fill="#64748b" font-size="10" font-mono>750</text>

        <line x1="0" y1="120" x2="880" y2="120" stroke="#1e293b" stroke-dasharray="3,3" />
        <text x="-30" y="124" fill="#64748b" font-size="10" font-mono>500</text>

        <line x1="0" y1="180" x2="880" y2="180" stroke="#1e293b" stroke-dasharray="3,3" />
        <text x="-30" y="184" fill="#64748b" font-size="10" font-mono>250</text>

        <line x1="0" y1="240" x2="880" y2="240" stroke="#334155" stroke-width="1.5" />
        <text x="-25" y="244" fill="#64748b" font-size="10" font-mono>0</text>

        <!-- GHI Shaded Area & Curve -->
        <!-- Curve from x=160 (04:00 sunrise) peak at x=440 (12:00) sunset at x=720 (20:00) -->
        <path d="M 160,240 C 240,220 320,80 440,30 C 560,80 640,220 720,240 Z" fill="url(#ghiArea)" />
        <path d="M 0,240 L 160,240 C 240,220 320,80 440,30 C 560,80 640,220 720,240 L 880,240" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linejoin="round" />

        <!-- DNI Curve (Higher peak normal irradiance, 950 W/m²) -->
        <path d="M 170,240 C 250,140 330,40 440,15 C 550,40 630,140 710,240" stroke="#f97316" stroke-width="2.5" stroke-dasharray="5,3" fill="none" />

        <!-- DHI Diffuse Component (Lower bell curve ~200 W/m²) -->
        <path d="M 160,240 C 260,220 340,195 440,190 C 540,195 620,220 720,240" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.85" />

        <!-- Highlight cursor at Noon (12:00 / 13:00) -->
        <line x1="440" y1="0" x2="440" y2="240" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" />
        <circle cx="440" cy="30" r="5" fill="#fef08a" stroke="#d97706" stroke-width="2" />

        <!-- Floating tooltip box -->
        <g transform="translate(452, 20)">
          <rect width="170" height="74" rx="8" fill="#020617" stroke="#f59e0b" stroke-width="1" />
          <text x="10" y="18" fill="#fde68a" font-size="11" font-weight="700" class="font-mono">12:00 UTC (Midi Solaire)</text>
          <text x="10" y="34" fill="#fbbf24" font-size="11" class="font-mono">GHI : 892 W/m²</text>
          <text x="10" y="49" fill="#fb923c" font-size="11" class="font-mono">DNI : 910 W/m² (H_sun: 64.6°)</text>
          <text x="10" y="64" fill="#38bdf8" font-size="11" class="font-mono">DHI : 115 W/m²</text>
        </g>

        <!-- X axis hours -->
        <text x="0" y="258" fill="#64748b" font-size="10" font-mono>00:00</text>
        <text x="146" y="258" fill="#64748b" font-size="10" font-mono>04:00</text>
        <text x="293" y="258" fill="#64748b" font-size="10" font-mono>08:00</text>
        <text x="440" y="258" fill="#fbbf24" font-size="10" font-weight="700" font-mono>12:00</text>
        <text x="586" y="258" fill="#64748b" font-size="10" font-mono>16:00</text>
        <text x="733" y="258" fill="#64748b" font-size="10" font-mono>20:00</text>
        <text x="850" y="258" fill="#64748b" font-size="10" font-mono>23:00</text>
      </g>
    </g>

    <!-- BOTTOM SYSTEM SETTINGS & ONBOARDING PREVIEW BAR -->
    <g transform="translate(0, 540)">
      <rect width="986" height="136" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />

      <g transform="translate(20, 20)">
        <text x="0" y="16" fill="#f8fafc" font-size="14" font-weight="700" class="font-sans">Centre de Contrôle Système &amp; Mises à Jour Automatiques</text>
        <text x="0" y="34" fill="#94a3b8" font-size="11" class="font-sans">
          Mises à jour automatiques en arrière-plan activées (cycle 15 min) · Date de sortie : 28 octobre 2026 · Zéro port réseau ouvert.
        </text>

        <!-- 3 Feature Chips -->
        <g transform="translate(0, 52)">
          <!-- Chip 1: Auto-update -->
          <rect width="210" height="34" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
          <circle cx="16" cy="17" r="4" fill="#10b981" />
          <text x="28" y="21" fill="#6ee7b7" font-size="11" font-weight="600" class="font-mono">Auto-Update : Activé</text>

          <!-- Chip 2: Theme Clair / Sombre -->
          <g transform="translate(224, 0)">
            <rect width="210" height="34" rx="8" fill="#581c87" fill-opacity="0.3" stroke="#7e22ce" stroke-width="1" />
            <circle cx="16" cy="17" r="4" fill="#c084fc" />
            <text x="28" y="21" fill="#e9d5ff" font-size="11" font-weight="600" class="font-mono">Thème Clair &amp; Sombre</text>
          </g>

          <!-- Chip 3: Mentions Légales & Non-Responsabilité -->
          <g transform="translate(448, 0)">
            <rect width="240" height="34" rx="8" fill="#881337" fill-opacity="0.3" stroke="#be123c" stroke-width="1" />
            <circle cx="16" cy="17" r="4" fill="#f43f5e" />
            <text x="28" y="21" fill="#fecdd3" font-size="11" font-weight="600" class="font-mono">Mentions Légales : Conforme</text>
          </g>
        </g>
      </g>
    </g>

  </g>
</svg>
